<!DOCTYPE html>
<html>
<head>
    <title>My Documents</title>
</head>
<body>

<h1>My Documents</h1>

<a href="{% url 'documents:upload' %}">
    Upload Document
</a>

<hr>

{% if documents %}

    {% for document in documents %}

        <div>
            <h3>{{ document.title }}</h3>

            <p>Status: {{ document.status }}</p>

            <p>Uploaded: {{ document.uploaded_at }}</p>
        </div>

        <hr>

    {% endfor %}

{% else %}

    <p>You haven't uploaded any documents yet.</p>

{% endif %}

</body>
</html>
