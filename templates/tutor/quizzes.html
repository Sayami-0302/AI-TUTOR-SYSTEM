{% extends 'base.html' %}

{% block title %}Quizzes | TutorAI{% endblock %}
{% block header_title %}Quiz Center{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 text-center">
        <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
            <i class="fa-solid fa-circle-question"></i>
        </div>
        <h2 class="text-xl font-bold text-gray-900 mb-2">No Quizzes Available</h2>
        <p class="text-sm text-gray-500 mb-6">Upload study documents first, then our AI will generate personalized quizzes for you.</p>
        <a href="{% url 'documents' %}" class="inline-block px-6 py-3 bg-emerald-600 text-white font-semibold rounded-xl hover:bg-emerald-700 transition">
            <i class="fa-solid fa-file-arrow-up mr-2"></i> Go to Documents
        </a>
    </div>
</div>
{% endblock %}
